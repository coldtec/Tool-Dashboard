<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tool Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#0a1220;--panel:#121e30;--line:#27364c;--text:#eef5ff;--muted:#9aacc3;--accent:#48d9c0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0%,#17374a 0,transparent 38%),var(--bg);font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);min-height:100vh}.shell{max-width:1260px;margin:auto;padding:50px 26px 90px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.18em;font-size:11px;text-transform:uppercase}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.055em;margin:12px 0 8px}p{color:var(--muted);margin:0}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}.count{color:var(--muted);font-size:13px}.search{margin:35px 0 20px;position:relative}.search svg{position:absolute;left:19px;top:50%;transform:translateY(-50%);color:var(--muted)}input{width:100%;padding:18px 20px 18px 53px;background:#152237;border:1px solid #34445b;border-radius:15px;color:white;outline:none;font:inherit;font-size:16px}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #48d9c01b}input::placeholder{color:#8799af}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:28px}.filter{border:1px solid var(--line);background:#152237;color:#b8c9dd;border-radius:100px;padding:10px 16px;cursor:pointer;font:inherit;font-size:13px}.filter.active{color:#061b21;background:var(--accent);border-color:var(--accent);font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.tile{position:relative;min-height:154px;background:linear-gradient(145deg,#17273b,#111d2e);border:1px solid #293b51;border-radius:17px;transition:transform .18s,border-color .18s,background .18s}.tile:hover{transform:translateY(-3px);border-color:#4cccb7}.tile a{display:flex;flex-direction:column;justify-content:space-between;min-height:154px;padding:23px;text-decoration:none;color:inherit}.glyph{width:42px;height:42px;display:grid;place-items:center;background:#21483f;border-radius:12px;color:var(--accent);font-size:19px;font-weight:800}.tile-name{font-weight:750;font-size:17px;line-height:1.3;margin-top:20px;overflow-wrap:anywhere;padding-right:22px}.area{color:var(--muted);font-size:12px;margin-top:7px}.info{position:absolute;right:15px;top:15px;width:30px;height:30px;border-radius:50%;border:1px solid #52657b;background:#23334a;color:#d8e8fa;font-size:17px;cursor:pointer;z-index:1}.info:hover,.info:focus-visible{background:var(--accent);color:#061b21}.empty{padding:54px 22px;text-align:center;border:1px dashed #38506b;border-radius:18px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:8px}.footer{margin-top:38px;font-size:12px;color:#8194aa}dialog{background:#17263a;border:1px solid #4b647a;border-radius:18px;color:var(--text);padding:28px;max-width:min(460px,calc(100vw - 32px));width:100%;box-shadow:0 20px 90px #0009}dialog::backdrop{background:#030b15bd}dialog h2{margin:0 32px 10px 0;font-size:22px;overflow-wrap:anywhere}dialog p{line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}dialog .close{position:absolute;right:17px;top:14px;border:0;background:transparent;color:#c4d5e7;font-size:27px;cursor:pointer}dialog .tag{color:var(--accent);font-size:12px;margin-bottom:14px}.notice{color:#f5c979;font-size:13px;margin-top:12px}@media(max-width:560px){.shell{padding:32px 16px 60px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile,.tile a{min-height:158px}.tile a{padding:15px}.tile-name{font-size:14px}.area{font-size:11px}.info{right:10px;top:10px}.glyph{width:37px;height:37px}.search{margin-top:27px}}@media(max-width:350px){.grid{grid-template-columns:1fr}}
/* Sanft aufgehellte Variante des ursprünglichen Dark Designs */
:root{--bg:#111d2c;--panel:#1c2d40;--line:#35495f;--text:#f0f6ff;--muted:#b0c1d2;--accent:#55dfc8}
body{background:radial-gradient(ellipse at 90% 0%,#24485b 0,transparent 42%),var(--bg)}
input{background:#203247;border-color:#42576e;color:var(--text)}
.filter{background:#b9e7f7;color:#12364c;border-color:#d5f3ff;font-weight:650;box-shadow:0 2px 8px #0002;transition:background .18s,transform .18s,border-color .18s}.filter:hover{background:#d8f3ff;border-color:#e8faff;transform:translateY(-1px)}.filter.active{background:#55dfc8;color:#102b30;border-color:#55dfc8;box-shadow:0 0 0 2px #55dfc82b}
.tile{background:linear-gradient(145deg,#24384d,#1b2b3e);border-color:#3b5168}
.glyph{background:#28564e}
.info{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;border:1px solid #587b88;background:#294458;color:#8cf0dd;transition:background .18s,color .18s,transform .18s}
.info svg{width:18px;height:18px;display:block}
.info:hover,.info:focus-visible{background:var(--accent);color:#10252a;transform:scale(1.06)}
dialog{background:#22364b;border-color:#587084}
</style>
</head>
<body><main class="shell"><header class="top"><div><div class="eyebrow">Deine zentrale Übersicht</div><h1>Tool Dashboard<span style="color:var(--accent)">.</span></h1><p>Alle Anwendungen und wichtigen Links an einem Ort.</p></div><span class="count" id="count"></span></header>
<div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="Tool, Bereich oder Stichwort suchen …" autocomplete="off" aria-label="Tools durchsuchen"></div>
<nav class="filters" id="filters" aria-label="Bereiche"></nav><section class="grid" id="grid" aria-live="polite"></section><div class="empty" id="empty" hidden></div><footer class="footer">Tool Dashboard · Links werden aus tools.xlsx geladen</footer></main>
<dialog id="modal" aria-labelledby="modal-title"><button class="close" id="close" aria-label="Schliessen">×</button><div class="tag" id="modal-area"></div><h2 id="modal-title"></h2><p id="modal-info"></p></dialog>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let tools=[],active='Alle';const grid=$('grid'),filters=$('filters'),empty=$('empty'),search=$('search'),modal=$('modal');const norm=s=>String(s??'').trim();function safeUrl(value){const url=norm(value);try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}function render(){const areas=['Alle',...new Set(tools.map(t=>t.area).filter(Boolean))].sort((a,b)=>a==='Alle'?-1:b==='Alle'?1:a.localeCompare(b,'de-CH'));filters.replaceChildren();for(const area of areas){const b=document.createElement('button');b.className='filter'+(active===area?' active':'');b.textContent=area;b.type='button';b.setAttribute('aria-pressed',String(active===area));b.onclick=()=>{active=area;render()};filters.append(b)}const q=search.value.toLocaleLowerCase('de-CH').trim();const shown=tools.filter(t=>(active==='Alle'||t.area===active)&&[t.name,t.area,t.info].join(' ').toLocaleLowerCase('de-CH').includes(q));grid.replaceChildren();for(const t of shown){const tile=document.createElement('article');tile.className='tile';const a=document.createElement('a');a.href=t.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',t.name+' öffnen');const glyph=document.createElement('div');glyph.className='glyph';glyph.textContent=t.name.slice(0,1).toUpperCase();const label=document.createElement('div');const name=document.createElement('div');name.className='tile-name';name.textContent=t.name;const area=document.createElement('div');area.className='area';area.textContent=t.area||'Allgemein';label.append(name,area);a.append(glyph,label);const info=document.createElement('button');info.className='info';info.type='button';info.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>';info.setAttribute('aria-label','Info zu '+t.name);info.onclick=()=>{$('modal-title').textContent=t.name;$('modal-area').textContent=t.area||'Allgemein';$('modal-info').textContent=t.info||'Keine Beschreibung hinterlegt.';modal.showModal()};tile.append(a,info);grid.append(tile)}$('count').textContent=shown.length+' '+(shown.length===1?'Tool':'Tools');empty.hidden=shown.length!==0;if(!shown.length)empty.innerHTML=tools.length?'<strong>Keine Treffer</strong>Versuche einen anderen Suchbegriff oder Bereich.':'<strong>Noch keine Tools hinterlegt</strong>Trage deine Links in tools.xlsx ein und lade die Datei in GitHub hoch.'}function error(msg){grid.replaceChildren();filters.replaceChildren();$('count').textContent='';empty.hidden=false;empty.replaceChildren();const h=document.createElement('strong');h.textContent='Tools konnten nicht geladen werden';const p=document.createElement('div');p.textContent=msg;empty.append(h,p)}$('close').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});search.addEventListener('input',render);async function load(){try{if(!window.XLSX)throw Error('Die Excel-Bibliothek konnte nicht geladen werden. Prüfe die Internetverbindung.');const res=await fetch('./tools.xlsx?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('tools.xlsx wurde nicht gefunden (HTTP '+res.status+').');const data=await res.arrayBuffer();const wb=XLSX.read(data,{type:'array'});const ws=wb.Sheets['Tools']||wb.Sheets[wb.SheetNames[0]];if(!ws)throw Error('Die Excel-Datei enthält kein Tabellenblatt.');const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});tools=rows.map(row=>({name:norm(row.Name),url:safeUrl(row.Link),area:norm(row.Bereich)||'Allgemein',info:norm(row.Info)})).filter(t=>t.name&&t.url).sort((a,b)=>a.name.localeCompare(b.name,'de-CH'));render()}catch(e){error(e.message)}}load()})();
</script></body></html>
